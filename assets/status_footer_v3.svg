<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%" style="background:#050811; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="footGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0f172a" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <filter id="footGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    @keyframes footPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .pulse-dot {
      animation: footPulse 3s infinite ease-in-out;
      transform-origin: 40px 40px;
    }
  </style>

  <rect width="900" height="80" rx="8" fill="#050811" />
  <rect width="900" height="80" rx="8" fill="url(#footGrid)" />
  <rect x="1" y="1" width="898" height="78" rx="7" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Status Pulse Dot -->
  <circle cx="40" cy="40" r="4" fill="#00f0ff" class="pulse-dot" filter="url(#footGlow)"/>
  <circle cx="40" cy="40" r="2" fill="#ffffff"/>

  <!-- Left Telemetry Text -->
  <text x="58" y="44" fill="#94a3b8" class="mono" font-size="12" letter-spacing="1">
    <tspan fill="#00f0ff" font-weight="bold">SYSTEM ONLINE</tspan>  // ALL AGENT &amp; SECURITY PIPELINES OPERATIONAL
  </text>

  <!-- Right Metadata -->
  <text x="860" y="44" fill="#64748b" class="mono" font-size="11" text-anchor="end" letter-spacing="1">
    TB-8821 // VER: 2026.4
  </text>
</svg>
