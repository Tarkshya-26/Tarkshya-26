<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#050811; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="workGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0f172a" stroke-width="0.8" opacity="0.5"/>
    </pattern>
    <filter id="workGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="960" height="620" rx="12" fill="#050811" />
  <rect width="960" height="620" rx="12" fill="url(#workGrid)" />
  <rect x="1" y="1" width="958" height="618" rx="11" fill="none" stroke="#16243b" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(40, 35)">
    <rect width="190" height="28" rx="4" fill="#0b1730" stroke="#00f0ff" stroke-width="1" filter="url(#workGlow)"/>
    <text x="95" y="18" fill="#00f0ff" class="mono" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">03 / SELECTED WORK</text>
  </g>

  <!-- Project 1: Enterprise Risk Register Chatbot -->
  <g transform="translate(40, 85)">
    <rect width="880" height="115" rx="8" fill="#070e1c" stroke="#16243b" stroke-width="1.5" />
    <rect x="0" y="0" width="880" height="32" rx="8" fill="#091428" />
    <text x="16" y="21" fill="#f8fafc" class="sans" font-size="13" font-weight="800" letter-spacing="0.5">01 // ENTERPRISE RISK REGISTER CHATBOT</text>
    <text x="400" y="21" fill="#00f0ff" class="mono" font-size="11" font-weight="bold">[ROLE: INFORMATION SECURITY ENGINEER @ PAYU]</text>
    
    <text x="16" y="55" fill="#94a3b8" class="sans" font-size="12.5">
      <tspan x="16" dy="0">Engineered an Agentic AI-based Risk Register system built around enterprise security and risk-management workflows.</tspan>
      <tspan x="16" dy="20">Connected AI agents with internal tools and databases, enabling conversational risk telemetry inspection &amp; automated action dispatch.</tspan>
    </text>
    <text x="16" y="100" fill="#38bdf8" class="mono" font-size="11">STACK: FastAPI • React • MCP • LLM Agents • AWS • Linux • REST APIs</text>
  </g>

  <!-- Project 2: Agentic AI with Frameworks -->
  <g transform="translate(40, 215)">
    <rect width="880" height="115" rx="8" fill="#070e1c" stroke="#16243b" stroke-width="1.5" />
    <rect x="0" y="0" width="880" height="32" rx="8" fill="#091428" />
    <text x="16" y="21" fill="#f8fafc" class="sans" font-size="13" font-weight="800" letter-spacing="0.5">02 // AGENTIC AI WITH FRAMEWORKS</text>
    <text x="400" y="21" fill="#00f0ff" class="mono" font-size="11" font-weight="bold">[REPO: Tarkshya-26/Agentic_AI_with_Frameworks ↗]</text>
    
    <text x="16" y="55" fill="#94a3b8" class="sans" font-size="12.5">
      <tspan x="16" dy="0">Hands-on reference implementations across modern agentic architectures. Demonstrates multi-agent coordination,</tspan>
      <tspan x="16" dy="20">graph-based state machines, dynamic tool calling, memory management, and MCP server integrations.</tspan>
    </text>
    <text x="16" y="100" fill="#38bdf8" class="mono" font-size="11">STACK: OpenAI Agents SDK • LangGraph • CrewAI • AutoGen • MCP • Python</text>
  </g>

  <!-- Project 3: LLM Engineering & RAG Architectures -->
  <g transform="translate(40, 345)">
    <rect width="880" height="115" rx="8" fill="#070e1c" stroke="#16243b" stroke-width="1.5" />
    <rect x="0" y="0" width="880" height="32" rx="8" fill="#091428" />
    <text x="16" y="21" fill="#f8fafc" class="sans" font-size="13" font-weight="800" letter-spacing="0.5">03 // LLM ENGINEERING &amp; RAG ARCHITECTURES</text>
    <text x="430" y="21" fill="#00f0ff" class="mono" font-size="11" font-weight="bold">[REPO: Tarkshya-26/LLM_ENG ↗]</text>
    
    <text x="16" y="55" fill="#94a3b8" class="sans" font-size="12.5">
      <tspan x="16" dy="0">Comprehensive suite of production-focused LLM engineering patterns. Covers hybrid retrieval, vector index optimization,</tspan>
      <tspan x="16" dy="20">semantic search, prompt evaluation, and deterministic wrapper layers around non-deterministic model outputs.</tspan>
    </text>
    <text x="16" y="100" fill="#38bdf8" class="mono" font-size="11">STACK: Python • RAG • Vector Databases • Embeddings • FastAPI • Structured Outputs</text>
  </g>

  <!-- Project 4: AI Security & Tool Boundary Systems -->
  <g transform="translate(40, 475)">
    <rect width="880" height="115" rx="8" fill="#070e1c" stroke="#16243b" stroke-width="1.5" />
    <rect x="0" y="0" width="880" height="32" rx="8" fill="#091428" />
    <text x="16" y="21" fill="#f8fafc" class="sans" font-size="13" font-weight="800" letter-spacing="0.5">04 // AI SECURITY &amp; TOOL BOUNDARY SYSTEMS</text>
    <text x="430" y="21" fill="#00f0ff" class="mono" font-size="11" font-weight="bold">[AREA: SECURITY ENGINEERING &amp; SYSTEM ISOLATION]</text>
    
    <text x="16" y="55" fill="#94a3b8" class="sans" font-size="12.5">
      <tspan x="16" dy="0">Research and implementation of security boundaries for tool-calling agents. Focuses on sandboxing external API access,</tspan>
      <tspan x="16" dy="20">enforcement of least privilege on agent actions, and automated auditing of AI-triggered actions.</tspan>
    </text>
    <text x="16" y="100" fill="#38bdf8" class="mono" font-size="11">STACK: FastAPI • Python • Security Systems • Tool Calling • Access Controls</text>
  </g>
</svg>