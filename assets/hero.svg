<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" style="background:#050811; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0f172a" stroke-width="0.8" opacity="0.5"/>
      <circle cx="30" cy="30" r="0.8" fill="#1e293b"/>
    </pattern>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes flowArc {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: -800; }
    }

    .status-dot-sys {
      animation: pulse 2.5s infinite ease-in-out;
      transform-origin: 40px 42px;
    }

    .cursor-block {
      animation: blinkCursor 1s infinite steps(1);
    }

    .arc-glow {
      stroke-dasharray: 120 680;
      animation: flowArc 8s linear infinite;
    }
  </style>

  <!-- Canvas Background & Grid -->
  <rect width="960" height="440" rx="12" fill="#050811" />
  <rect width="960" height="440" rx="12" fill="url(#gridPattern)" />
  <rect x="1" y="1" width="958" height="438" rx="11" fill="none" stroke="#162032" stroke-width="1" />

  <!-- Corner Tech Brackets (Electric Blue) -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.9" />
  <path d="M 940 40 L 940 20 L 920 20" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.9" />
  <path d="M 20 400 L 20 420 L 40 420" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.9" />
  <path d="M 940 400 L 940 420 L 920 420" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.9" />

  <!-- Background Monospace System Floating Nodes -->
  <text x="60" y="415" fill="#1e293b" class="mono" font-size="12" opacity="0.6">USER</text>
  <text x="320" y="415" fill="#1e293b" class="mono" font-size="12" opacity="0.6">LLM</text>
  <text x="500" y="415" fill="#1e293b" class="mono" font-size="12" opacity="0.6">RAG</text>
  <text x="680" y="415" fill="#1e293b" class="mono" font-size="12" opacity="0.6">AGENTS_SDK</text>
  <text x="860" y="415" fill="#1e293b" class="mono" font-size="12" opacity="0.6">MCP</text>

  <!-- Background Curved Electric Blue Signal Track -->
  <path d="M 460 10 Q 720 180 930 380" stroke="#0f223d" stroke-width="1.5" fill="none" />
  <path d="M 460 10 Q 720 180 930 380" stroke="#00f0ff" stroke-width="2" fill="none" class="arc-glow" opacity="0.8" filter="url(#blueGlow)"/>
  <circle cx="930" cy="380" r="5" fill="#00f0ff" filter="url(#blueGlow)"/>
  <circle cx="930" cy="380" r="2" fill="#ffffff" />

  <!-- Top Status Line -->
  <g transform="translate(40, 42)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="status-dot-sys" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
    <text x="14" y="4" fill="#00f0ff" class="mono" font-size="11" font-weight="bold" letter-spacing="1">SYSTEM ONLINE</text>
    <text x="140" y="4" fill="#64748b" class="mono" font-size="11" letter-spacing="1">NIT SRINAGAR • INDIA</text>
    <text x="320" y="4" fill="#334155" class="mono" font-size="11">//</text>
    <text x="345" y="4" fill="#64748b" class="mono" font-size="11" letter-spacing="1">SEC_LEVEL: ALPHA</text>
    <text x="490" y="4" fill="#334155" class="mono" font-size="11">//</text>
    <text x="515" y="4" fill="#64748b" class="mono" font-size="11" letter-spacing="1">NODE: ACTIVE</text>
  </g>

  <!-- Main Huge Stacked Title -->
  <text x="40" y="112" fill="#f8fafc" class="sans" font-size="46" font-weight="900" letter-spacing="3">TARKSHYA</text>
  <text x="40" y="162" fill="#f8fafc" class="sans" font-size="46" font-weight="900" letter-spacing="3">BHARDWAJ</text>

  <!-- Subtitle with Glowing Cursor -->
  <g transform="translate(40, 196)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="15" font-weight="bold" letter-spacing="2">AI &amp; SECURITY ENGINEER</text>
    <rect x="235" y="-12" width="9" height="15" fill="#00f0ff" class="cursor-block" filter="url(#softGlow)"/>
  </g>

  <!-- Core Identity Badges Pill Row -->
  <g transform="translate(40, 218)">
    <rect x="0" y="0" width="165" height="24" rx="4" fill="#071224" stroke="#162947" stroke-width="1"/>
    <text x="82.5" y="16" fill="#00f0ff" class="mono" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">AI SYSTEMS ENGINEER</text>

    <rect x="175" y="0" width="105" height="24" rx="4" fill="#071224" stroke="#162947" stroke-width="1"/>
    <text x="227.5" y="16" fill="#38bdf8" class="mono" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">AGENTIC AI</text>

    <rect x="290" y="0" width="145" height="24" rx="4" fill="#071224" stroke="#162947" stroke-width="1"/>
    <text x="362.5" y="16" fill="#38bdf8" class="mono" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">LLM ENGINEERING</text>

    <rect x="445" y="0" width="110" height="24" rx="4" fill="#071224" stroke="#162947" stroke-width="1"/>
    <text x="500" y="16" fill="#38bdf8" class="mono" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">AI SECURITY</text>
  </g>

  <!-- Bold Headline -->
  <text x="40" y="275" fill="#f1f5f9" class="sans" font-size="20" font-weight="800" letter-spacing="0.5">Building intelligent systems with security at their core.</text>

  <!-- Extended Paragraph Text -->
  <text x="40" y="308" fill="#94a3b8" class="sans" font-size="13.5" font-weight="400">
    <tspan x="40" dy="0">I build intelligent systems that connect AI models with tools, APIs, data, and real-world infrastructure — while</tspan>
    <tspan x="40" dy="22">developing a working understanding of the security boundaries that emerge when AI is given the ability to act.</tspan>
  </text>

  <!-- Right Side Instrumentation Panel -->
  <g transform="translate(605, 90)">
    <rect width="315" height="155" rx="8" fill="#070e1c" stroke="#16243b" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="315" height="30" rx="8" fill="#091428" />
    <path d="M 0 30 L 315 30" stroke="#16243b" stroke-width="1" />
    <text x="14" y="19" fill="#00f0ff" class="mono" font-size="11" font-weight="bold" letter-spacing="1">SYSTEM TELEMETRY // CORE</text>
    
    <!-- Rows -->
    <text x="14" y="52" fill="#64748b" class="mono" font-size="10.5">PRIMARY:<tspan x="90" fill="#e2e8f0">AI Systems &amp; Agentic AI</tspan></text>
    <text x="14" y="74" fill="#64748b" class="mono" font-size="10.5">FOCUS:<tspan x="90" fill="#e2e8f0">Security &amp; Tool Boundaries</tspan></text>
    <text x="14" y="96" fill="#64748b" class="mono" font-size="10.5">CORE:<tspan x="90" fill="#00f0ff">LLMs • RAG • MCP • FastAPI</tspan></text>
    <text x="14" y="118" fill="#64748b" class="mono" font-size="10.5">STATUS:<tspan x="90" fill="#38bdf8">Operational (All Nodes OK)</tspan></text>
    <text x="14" y="140" fill="#64748b" class="mono" font-size="10.5">INSTITUTE:<tspan x="90" fill="#94a3b8">NIT Srinagar (IT Dept)</tspan></text>
  </g>

  <!-- Action Capsule Buttons -->
  <g transform="translate(40, 365)">
    <!-- Button 1: EXPLORE MY WORK -->
    <g transform="translate(0, 0)">
      <rect width="145" height="36" rx="18" fill="#081224" stroke="#1d3354" stroke-width="1.5" />
      <text x="72.5" y="22" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.8">EXPLORE WORK →</text>
    </g>

    <!-- Button 2: DOWNLOAD RESUME -->
    <g transform="translate(155, 0)">
      <rect width="155" height="36" rx="18" fill="#081224" stroke="#1d3354" stroke-width="1.5" />
      <text x="77.5" y="22" fill="#e2e8f0" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.8">GET RESUME ↓</text>
    </g>

    <!-- Button 3: CONTACT -->
    <g transform="translate(320, 0)">
      <rect width="115" height="36" rx="18" fill="#081224" stroke="#00f0ff" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="57.5" y="22" fill="#00f0ff" class="mono" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.8">CONTACT →</text>
    </g>
  </g>
</svg>