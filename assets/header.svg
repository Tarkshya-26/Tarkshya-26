<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%" style="background:#050811; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0f172a" stroke-width="0.8" opacity="0.6"/>
      <circle cx="30" cy="30" r="0.8" fill="#1e293b"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Signal Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    
    @keyframes signalMove {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: -600; }
    }

    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.03; }
      50% { opacity: 0.08; }
      100% { transform: translateY(240px); opacity: 0.03; }
    }

    .status-dot {
      animation: pulse 3s infinite ease-in-out;
      transform-origin: 35px 32px;
    }

    .signal-line {
      stroke-dasharray: 80 520;
      animation: signalMove 6s linear infinite;
    }

    .tag-box {
      transition: all 0.3s ease;
    }
  </style>

  <!-- Canvas Background & Grid -->
  <rect width="900" height="240" rx="8" fill="#050811" />
  <rect width="900" height="240" rx="8" fill="url(#grid)" />

  <!-- Outer Technical Border -->
  <rect x="1" y="1" width="898" height="238" rx="7" fill="none" stroke="#1e293b" stroke-width="1" />
  
  <!-- Corner Crosshair Accent Markers -->
  <path d="M 12 20 L 12 12 L 20 12" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 888 20 L 888 12 L 880 12" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 12 220 L 12 228 L 20 228" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 888 220 L 888 228 L 880 228" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>

  <!-- Top System Telemetry Line -->
  <g transform="translate(35, 32)">
    <!-- Status LED -->
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="status-dot" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
    
    <text x="16" y="4" fill="#64748b" class="mono" font-size="11" letter-spacing="1">
      <tspan fill="#00f0ff" font-weight="bold">SYS_ID:</tspan> TB-8821 <tspan fill="#334155">//</tspan> 
      <tspan fill="#00f0ff" font-weight="bold">LOC:</tspan> NIT_SRINAGAR <tspan fill="#334155">//</tspan> 
      <tspan fill="#00f0ff" font-weight="bold">STATUS:</tspan> OPERATIONAL <tspan fill="#334155">//</tspan> 
      <tspan fill="#00f0ff" font-weight="bold">NODE:</tspan> ACTIVE
    </text>
  </g>

  <!-- Vector Trace Track & Animated Signal Pulse -->
  <line x1="35" y1="48" x2="865" y2="48" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="35" y1="48" x2="865" y2="48" stroke="url(#lineGrad)" stroke-width="2" class="signal-line" filter="url(#glow)"/>

  <!-- Main Identity Header -->
  <text x="35" y="102" fill="#f8fafc" class="sans" font-size="36" font-weight="900" letter-spacing="4">TARKSHYA BHARDWAJ</text>
  
  <!-- Primary Subtitle -->
  <text x="35" y="132" fill="#00f0ff" class="mono" font-size="15" font-weight="700" letter-spacing="3">AI &amp; SECURITY ENGINEER</text>
  
  <!-- Descriptive Positioning -->
  <text x="35" y="160" fill="#94a3b8" class="sans" font-size="14" font-weight="400" letter-spacing="0.5">Building intelligent systems with security at their core.</text>

  <!-- Bottom Technical Instrumentation Pills -->
  <g transform="translate(35, 185)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="4" fill="#0b1329" stroke="#1d2d4a" stroke-width="1"/>
      <text x="65" y="17" fill="#38bdf8" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">AGENTIC_AI</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(140, 0)">
      <rect width="115" height="26" rx="4" fill="#0b1329" stroke="#1d2d4a" stroke-width="1"/>
      <text x="57.5" y="17" fill="#38bdf8" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">LLM_ENG</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(265, 0)">
      <rect width="135" height="26" rx="4" fill="#0b1329" stroke="#1d2d4a" stroke-width="1"/>
      <text x="67.5" y="17" fill="#38bdf8" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">AI_SECURITY</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(410, 0)">
      <rect width="80" height="26" rx="4" fill="#0b1329" stroke="#1d2d4a" stroke-width="1"/>
      <text x="40" y="17" fill="#38bdf8" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">MCP</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(500, 0)">
      <rect width="100" height="26" rx="4" fill="#0b1329" stroke="#1d2d4a" stroke-width="1"/>
      <text x="50" y="17" fill="#38bdf8" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">FASTAPI</text>
    </g>

    <!-- Pill 6 -->
    <g transform="translate(610, 0)">
      <rect width="90" height="26" rx="4" fill="#0b1329" stroke="#1d2d4a" stroke-width="1"/>
      <text x="45" y="17" fill="#38bdf8" class="mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">PYTHON</text>
    </g>
  </g>
</svg>
