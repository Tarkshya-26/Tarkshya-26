  <path d="M996 52V126" stroke="#e3e8f1" stroke-width="1"/>
  <text x="1014" y="68" fill="#8a94a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.6">AGENTIC AI</text>
  <text x="1014" y="92" fill="#8a94a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.6">LLM ENGINEERING</text>
  <text x="1014" y="116" fill="#8a94a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.6">AI SECURITY</text>

