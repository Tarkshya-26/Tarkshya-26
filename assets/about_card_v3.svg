<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" style="background:#050811; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="aboutGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0f172a" stroke-width="0.8" opacity="0.5"/>
    </pattern>
    <filter id="aboutGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="960" height="360" rx="12" fill="#050811" />
  <rect width="960" height="360" rx="12" fill="url(#aboutGrid)" />
  <rect x="1" y="1" width="958" height="358" rx="11" fill="none" stroke="#16243b" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 944 32 L 944 16 L 928 16" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 16 328 L 16 344 L 32 344" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 944 328 L 944 344 L 928 344" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>

  <!-- Section Header -->
  <g transform="translate(40, 42)">
    <rect width="135" height="28" rx="4" fill="#0b1730" stroke="#00f0ff" stroke-width="1" filter="url(#aboutGlow)"/>
    <text x="67.5" y="18" fill="#00f0ff" class="mono" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">01 / ABOUT</text>
  </g>

  <!-- Core Identity Badges Row -->
  <g transform="translate(195, 42)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="28" rx="4" fill="#081326" stroke="#1c304d" stroke-width="1"/>
    <text x="82.5" y="18" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">AI SYSTEMS ENGINEER</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="110" height="28" rx="4" fill="#081326" stroke="#1c304d" stroke-width="1"/>
    <text x="230" y="18" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">AGENTIC AI</text>

    <!-- Pill 3 -->
    <rect x="295" y="0" width="145" height="28" rx="4" fill="#081326" stroke="#1c304d" stroke-width="1"/>
    <text x="367.5" y="18" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">LLM ENGINEERING</text>

    <!-- Pill 4 -->
    <rect x="450" y="0" width="115" height="28" rx="4" fill="#081326" stroke="#1c304d" stroke-width="1"/>
    <text x="507.5" y="18" fill="#38bdf8" class="mono" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">AI SECURITY</text>
  </g>

  <!-- Metadata Sub-panel -->
  <g transform="translate(40, 90)">
    <rect width="880" height="48" rx="6" fill="#070e1c" stroke="#17263c" stroke-width="1" />
    <text x="20" y="29" fill="#94a3b8" class="mono" font-size="11.5" letter-spacing="0.5">
      <tspan fill="#00f0ff" font-weight="bold">LOCATION:</tspan> NIT Srinagar, India <tspan fill="#334155">│</tspan> 
      <tspan fill="#00f0ff" font-weight="bold">FOCUS:</tspan> Intelligent Systems • Security • Agents <tspan fill="#334155">│</tspan> 
      <tspan fill="#00f0ff" font-weight="bold">STACK:</tspan> Python / FastAPI / MCP / LangGraph / OpenAI Agents SDK
    </text>
  </g>

  <!-- Positioning Quote Box -->
  <g transform="translate(40, 155)">
    <rect width="880" height="60" rx="6" fill="#091429" stroke="#1b3052" stroke-width="1" />
    <!-- Electric Blue Accent Bar -->
    <rect x="0" y="0" width="4" height="60" fill="#00f0ff" filter="url(#aboutGlow)"/>
    <text x="22" y="35" fill="#f8fafc" class="sans" font-size="14.5" font-weight="700" letter-spacing="0.2">
      "I build intelligent systems that connect models with tools, APIs, data and real-world infrastructure — with security considered at the system level."
    </text>
  </g>

  <!-- Narrative Paragraph -->
  <g transform="translate(40, 240)">
    <text x="0" y="0" fill="#94a3b8" class="sans" font-size="14" font-weight="400">
      <tspan x="0" dy="0">I am an Information Technology undergraduate at <tspan fill="#f1f5f9" font-weight="700">NIT Srinagar</tspan> operating at the intersection of <tspan fill="#00f0ff" font-weight="600">AI Systems Engineering</tspan>, </tspan>
      <tspan x="0" dy="24"><tspan fill="#00f0ff" font-weight="600">LLM Engineering</tspan>, <tspan fill="#00f0ff" font-weight="600">Agentic Architectures</tspan>, and <tspan fill="#00f0ff" font-weight="600">AI Security</tspan>. Rather than viewing models as standalone generators, I design</tspan>
      <tspan x="0" dy="24">end-to-end architectures where models function as reasoning components within broader software infrastructure.</tspan>
      <tspan x="0" dy="24">My engineering focuses on state management, tool isolation, deterministic guardrails, structured outputs, and security boundaries.</tspan>
    </text>
  </g>
</svg>