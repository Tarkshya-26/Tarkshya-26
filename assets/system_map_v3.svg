<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" style="background:#050811; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="sysGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0f172a" stroke-width="0.8" opacity="0.5"/>
      <circle cx="30" cy="30" r="0.8" fill="#1e293b"/>
    </pattern>

    <!-- Linear Gradient for Active Signal Paths -->
    <linearGradient id="sigGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }

    @keyframes pulseNode {
      0%, 100% { opacity: 0.3; r: 3.5px; }
      50% { opacity: 1; r: 5px; }
    }

    @keyframes flowLine1 {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes flowLine2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }

    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(440px); opacity: 0.2; }
    }

    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
    }

    .flow-path-1 {
      stroke-dasharray: 40 160;
      animation: flowLine1 5s linear infinite;
    }

    .flow-path-2 {
      stroke-dasharray: 30 130;
      animation: flowLine2 6s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="440" rx="8" fill="#050811" />
  <rect width="900" height="440" rx="8" fill="url(#sysGrid)" />
  <rect x="1" y="1" width="898" height="438" rx="7" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Top Instrumentation Label -->
  <g transform="translate(30, 30)">
    <text fill="#64748b" class="mono" font-size="11" letter-spacing="1">
      <tspan fill="#00f0ff" font-weight="bold">// SYSTEM ARCHITECTURE MAP</tspan>  [TOPOLOGY: DISTRIBUTED AGENTIC GRAPH]
    </text>
  </g>

  <!-- Corner Decorators -->
  <path d="M 12 18 L 18 18 M 12 18 L 12 24" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
  <path d="M 888 18 L 882 18 M 888 18 L 888 24" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
  <path d="M 12 422 L 18 422 M 12 422 L 12 416" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
  <path d="M 888 422 L 882 422 M 888 422 L 888 416" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>

  <!-- ==================== CENTRAL HUB ==================== -->
  <g transform="translate(450, 220)">
    <!-- Outer Ring -->
    <circle r="42" fill="#071126" stroke="#1d2d4a" stroke-width="1.5"/>
    <circle r="42" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="10 20" opacity="0.4"/>
    <!-- Core Hub Box -->
    <rect x="-34" y="-18" width="68" height="36" rx="4" fill="#0b1730" stroke="#00f0ff" stroke-width="1.5" filter="url(#blueGlow)"/>
    <text x="0" y="-2" fill="#f8fafc" class="mono" font-size="10" font-weight="bold" text-anchor="middle">SYSTEM</text>
    <text x="0" y="10" fill="#00f0ff" class="mono" font-size="9" font-weight="bold" text-anchor="middle">CORE</text>
  </g>

  <!-- ==================== LEFT BRANCH: LLM ENGINEERING ==================== -->

  <!-- Branch Trunk Line: Left -->
  <path d="M 408 220 L 260 220" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 408 220 L 260 220" stroke="url(#sigGradH)" stroke-width="2" class="flow-path-2" filter="url(#blueGlow)"/>

  <!-- Left Pillar Node: LLM ENGINEERING -->
  <g transform="translate(140, 220)">
    <rect x="-110" y="-22" width="220" height="44" rx="6" fill="#091328" stroke="#00f0ff" stroke-width="1.5" filter="url(#blueGlow)"/>
    <text x="0" y="-3" fill="#f8fafc" class="sans" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">LLM ENGINEERING</text>
    <text x="0" y="13" fill="#00f0ff" class="mono" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">ORCHESTRATION &amp; REASONING</text>
  </g>

  <!-- Sub-branch Connectors: Left Top to Bottom -->
  <path d="M 140 198 L 140 80 M 140 80 L 250 80" stroke="#1b2a47" stroke-width="1" fill="none"/>
  <path d="M 140 198 L 140 135 M 140 135 L 250 135" stroke="#1b2a47" stroke-width="1" fill="none"/>
  <path d="M 140 242 L 140 305 M 140 305 L 250 305" stroke="#1b2a47" stroke-width="1" fill="none"/>
  <path d="M 140 242 L 140 365 M 140 365 L 250 365" stroke="#1b2a47" stroke-width="1" fill="none"/>

  <!-- Animated flow dots on sub-branches -->
  <path d="M 140 80 L 250 80" stroke="#00f0ff" stroke-width="1.5" class="flow-path-1" fill="none"/>
  <path d="M 140 135 L 250 135" stroke="#00f0ff" stroke-width="1.5" class="flow-path-2" fill="none"/>
  <path d="M 140 305 L 250 305" stroke="#00f0ff" stroke-width="1.5" class="flow-path-1" fill="none"/>
  <path d="M 140 365 L 250 365" stroke="#00f0ff" stroke-width="1.5" class="flow-path-2" fill="none"/>

  <!-- Left Sub-Nodes -->
  <!-- Node 1: RAG -->
  <g transform="translate(250, 80)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="12" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="22" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">RAG</text>
    <text x="60" y="4" fill="#64748b" class="mono" font-size="9">[VECTOR_STORE]</text>
  </g>

  <!-- Node 2: AGENTS -->
  <g transform="translate(250, 135)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="12" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="22" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">AGENTS</text>
    <text x="80" y="4" fill="#64748b" class="mono" font-size="9">[LANGGRAPH]</text>
  </g>

  <!-- Node 3: TOOL USE -->
  <g transform="translate(250, 305)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="12" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="22" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">TOOL USE</text>
    <text x="92" y="4" fill="#64748b" class="mono" font-size="9">[DISPATCH]</text>
  </g>

  <!-- Node 4: MCP -->
  <g transform="translate(250, 365)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="12" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="22" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">MCP</text>
    <text x="60" y="4" fill="#64748b" class="mono" font-size="9">[PROTOCOL_BUS]</text>
  </g>

  <!-- ==================== RIGHT BRANCH: AI SYSTEMS ==================== -->

  <!-- Branch Trunk Line: Right -->
  <path d="M 492 220 L 640 220" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 492 220 L 640 220" stroke="url(#sigGradH)" stroke-width="2" class="flow-path-1" filter="url(#blueGlow)"/>

  <!-- Right Pillar Node: AI SYSTEMS -->
  <g transform="translate(760, 220)">
    <rect x="-110" y="-22" width="220" height="44" rx="6" fill="#091328" stroke="#00f0ff" stroke-width="1.5" filter="url(#blueGlow)"/>
    <text x="0" y="-3" fill="#f8fafc" class="sans" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">AI SYSTEMS</text>
    <text x="0" y="13" fill="#00f0ff" class="mono" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">SECURITY &amp; INFRASTRUCTURE</text>
  </g>

  <!-- Sub-branch Connectors: Right Top to Bottom -->
  <path d="M 760 198 L 760 80 M 760 80 L 650 80" stroke="#1b2a47" stroke-width="1" fill="none"/>
  <path d="M 760 198 L 760 135 M 760 135 L 650 135" stroke="#1b2a47" stroke-width="1" fill="none"/>
  <path d="M 760 242 L 760 305 M 760 305 L 650 305" stroke="#1b2a47" stroke-width="1" fill="none"/>
  <path d="M 760 242 L 760 365 M 760 365 L 650 365" stroke="#1b2a47" stroke-width="1" fill="none"/>

  <!-- Animated flow dots on sub-branches -->
  <path d="M 760 80 L 650 80" stroke="#00f0ff" stroke-width="1.5" class="flow-path-2" fill="none"/>
  <path d="M 760 135 L 650 135" stroke="#00f0ff" stroke-width="1.5" class="flow-path-1" fill="none"/>
  <path d="M 760 305 L 650 305" stroke="#00f0ff" stroke-width="1.5" class="flow-path-2" fill="none"/>
  <path d="M 760 365 L 650 365" stroke="#00f0ff" stroke-width="1.5" class="flow-path-1" fill="none"/>

  <!-- Right Sub-Nodes -->
  <!-- Node 1: SECURITY -->
  <g transform="translate(650, 80)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="-162" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="-152" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">SECURITY</text>
    <text x="-82" y="4" fill="#64748b" class="mono" font-size="9">[RISK_REG]</text>
  </g>

  <!-- Node 2: APIs -->
  <g transform="translate(650, 135)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="-162" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="-152" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">APIs</text>
    <text x="-115" y="4" fill="#64748b" class="mono" font-size="9">[FASTAPI/REST]</text>
  </g>

  <!-- Node 3: INFRASTRUCTURE -->
  <g transform="translate(650, 305)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="-162" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="-152" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">INFRA</text>
    <text x="-105" y="4" fill="#64748b" class="mono" font-size="9">[AWS/EC2/LINUX]</text>
  </g>

  <!-- Node 4: DATA -->
  <g transform="translate(650, 365)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="node-pulse" filter="url(#blueGlow)"/>
    <rect x="-162" y="-14" width="150" height="28" rx="4" fill="#080f1e" stroke="#1d2d4a" stroke-width="1"/>
    <text x="-152" y="4" fill="#e2e8f0" class="mono" font-size="11" font-weight="600">DATA</text>
    <text x="-110" y="4" fill="#64748b" class="mono" font-size="9">[STATE/MEMORY]</text>
  </g>

  <!-- Bottom Telemetry Status Line -->
  <g transform="translate(30, 415)">
    <text fill="#475569" class="mono" font-size="10" letter-spacing="1">
      <tspan fill="#00f0ff">● DATA PIPELINE:</tspan> INPUT → RETRIEVAL → MODEL REASONING → TOOL EXECUTION → AUDITED ACTION
    </text>
  </g>
</svg>
