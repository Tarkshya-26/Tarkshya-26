<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="100%" style="background:transparent; font-family: monospace;">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes divSignal {
      0% { stroke-dashoffset: 900; }
      100% { stroke-dashoffset: -900; }
    }
    .div-flow {
      stroke-dasharray: 100 800;
      animation: divSignal 7s linear infinite;
    }
  </style>

  <!-- Static Track -->
  <line x1="0" y1="12" x2="900" y2="12" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Animated Pulse Line -->
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#divGrad)" stroke-width="1.5" class="div-flow" filter="url(#divGlow)"/>

  <!-- Technical Node Markers -->
  <circle cx="0" cy="12" r="2" fill="#00f0ff"/>
  <circle cx="450" cy="12" r="2" fill="#00f0ff" opacity="0.6"/>
  <circle cx="900" cy="12" r="2" fill="#00f0ff"/>
</svg>
