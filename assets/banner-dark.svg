  <text x="1136" y="92" class="m" fill="#6a6a66" font-size="12" letter-spacing="3.2" text-anchor="end">NIT SRINAGAR &#183; INDIA</text>

  <text x="64" y="186" class="d" fill="#f0efec" font-size="82" font-weight="700" letter-spacing="-1.8">Tarkshya Bhardwaj</text>

