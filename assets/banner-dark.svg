<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Tarkshya Bhardwaj — AI &amp; Security Engineer">
  <defs>
    <style>
      @font-face{font-family:'SG';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900;font-style:normal}
      @font-face{font-family:'JB';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}
      .d{font-family:'SG',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'JB',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
